<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Efecto Scroll Horizontal con Gap al Inicio y Final</title>
  <style>
    /* Reset y estilos básicos */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    /* Contenido para ver antes y después */
    .spacer {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
    }
    /* Sección de scroll: la altura debe ser proporcional al ancho total del contenido */
    .scroll-section {
      position: relative;
      /* Con 4 párrafos de 100vw cada uno, 400vh es suficiente */
      height: 400vh;
    }
    /* Contenedor sticky que permanece fijo durante el scroll en la sección */
    .sticky-container {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
    }
    /* Contenedor horizontal que se desplaza internamente */
    .horizontal-container {
      display: flex;
      height: 100%;
      transition: transform 0.1s ease-out;
    }
    /* Cada párrafo ocupa el 100vw y está separado visualmente */
    .horizontal-container p {
      min-width: 100vw;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      font-size: 1.5em;
      text-align: center;
      background: #ddd;
      border-right: 1px solid #fff;
    }
  </style>
</head>
<body>
  <div class="spacer">
    <h1>Contenido Superior</h1>
  </div>

  <!-- Sección del efecto de scroll horizontal -->
  <section class="scroll-section">
    <div class="sticky-container">
      <div class="horizontal-container" id="horizontal-container">
        <p>Párrafo 1: Primer texto.</p>
        <p>Párrafo 2: Segundo texto.</p>
        <p>Párrafo 3: Tercer texto.</p>
        <p>Párrafo 4: Cuarto texto.</p>
      </div>
    </div>
  </section>

  <div class="spacer">
    <h1>Contenido Inferior</h1>
  </div>

  <script>
    const horizontalContainer = document.getElementById('horizontal-container');
    const scrollSection = document.querySelector('.scroll-section');

    // Calcula el máximo desplazamiento horizontal: diferencia entre el ancho total del contenido y el ancho del viewport
    const totalWidth = horizontalContainer.scrollWidth;
    const maxTranslate = totalWidth - window.innerWidth;

    // Definición de los gaps
    // gapStart: progreso mínimo (porcentaje) de scroll dentro de la sección para iniciar la traslación
    // gapEnd: porcentaje en que se completa la traslación
    const gapStart = 0.20; // 20%
    const gapEnd = 0.80;   // 80%

    window.addEventListener('scroll', () => {
      const sectionRect = scrollSection.getBoundingClientRect();
      let progress = 0;
      
      // Se calcula el progreso sólo cuando la sección ya está fijada (arriba del viewport)
      if (sectionRect.top <= 0) {
        progress = Math.min(Math.abs(sectionRect.top) / (scrollSection.offsetHeight - window.innerHeight), 1);
      }
      
      // Se aplica el gap:
      // - Hasta el 20% de progreso, no se desplaza horizontalmente.
      // - Entre 20% y 80% se incrementa linealmente.
      // - Por encima del 80% se mantiene en 1, dejando el gap final.
      let effectiveProgress = 0;
      if (progress < gapStart) {
        effectiveProgress = 0;
      } else if (progress > gapEnd) {
        effectiveProgress = 1;
      } else {
        effectiveProgress = (progress - gapStart) / (gapEnd - gapStart);
      }
      
      // Se aplica la transformación horizontal
      horizontalContainer.style.transform = `translateX(-${effectiveProgress * maxTranslate}px)`;
    });
  </script>
</body>
</html>
