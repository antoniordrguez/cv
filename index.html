<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Horizontal con Overlay</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    .spacer {
      height: 100vh;
      background: #000;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .scroll-container {
      height: calc(100vh * 3);
      position: relative;
      background: black;
      z-index: 0;
    }

    .styles-wrapper {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .styles-gallery {
      height: 80vh;
      width: 80vw;
      display: flex;
      flex-direction: row;
      position: relative;
      z-index: 1;
    }

    .content-group {
      display: flex;
      transition: transform 0.1s ease-out;
      height: 100%;
      width: 100%;
    }

    .style {
      width: 100%;
      height: 100%;
      flex: 0 0 100%;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      font-weight: bold;
      color: #333;
      clip-path: inset(0 calc((1 - var(--clip-progress, 1)) * 100%) 0 0);
      transition: clip-path 0.3s ease-out;
    }

    .style.default::before {
      content: "Bloque 1";
    }

    .style.color::before {
      content: "Bloque 2";
    }

    .style.bw::before {
      content: "Bloque 3";
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 300%;
      height: 100%;
      display: flex;
      pointer-events: none;
      transition: transform 0.1s ease-out;
      z-index: 2;
    }

    .slide {
      width: 100%;
      height: 100%;
      position: relative;
      flex-shrink: 0;
    }

    .slide .corner,
    .slide .rect {
      position: absolute;
      background: black;
    }

    .corner {
      width: 20px;
      height: 20px;
    }

    .rect {
      background: black;
    }

    .top.left { top: 0; left: 0; }
    .top.right { top: 0; right: 0; }
    .bottom.left { bottom: 0; left: 0; }
    .bottom.right { bottom: 0; right: 0; }

    .rect.top { top: 0; left: 20px; right: 20px; height: 4px; }
    .rect.bottom { bottom: 0; left: 20px; right: 20px; height: 4px; }
    .rect.left { top: 20px; bottom: 20px; left: 0; width: 4px; }
    .rect.right { top: 20px; bottom: 20px; right: 0; width: 4px; }
  </style>
</head>
<body>

  <div class="spacer">Scroll para ver la galería</div>

  <div class="scroll-container" id="scroll-container">
    <div class="styles-wrapper">
      <div class="styles-gallery">
        <div class="content-group" id="content-group">
          <div class="style default"></div>
          <div class="style color"></div>
          <div class="style bw"></div>
          <div class="overlay" id="overlay">
            <div class="slide">
              <div class="corner top left"></div>
              <div class="rect top"></div>
              <div class="corner top right"></div>
              <div class="rect right"></div>
              <div class="corner bottom right"></div>
              <div class="rect bottom"></div>
              <div class="corner bottom left"></div>
              <div class="rect left"></div>
            </div>
            <div class="slide">
              <div class="corner top left"></div>
              <div class="rect top"></div>
              <div class="corner top right"></div>
              <div class="rect right"></div>
              <div class="corner bottom right"></div>
              <div class="rect bottom"></div>
              <div class="corner bottom left"></div>
              <div class="rect left"></div>
            </div>
            <div class="slide">
              <div class="corner top left"></div>
              <div class="rect top"></div>
              <div class="corner top right"></div>
              <div class="rect right"></div>
              <div class="corner bottom right"></div>
              <div class="rect bottom"></div>
              <div class="corner bottom left"></div>
              <div class="rect left"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="spacer">Fin de la galería</div>

  <script>
    const scrollContainer = document.getElementById('scroll-container');
    const contentGroup = document.getElementById('content-group');
    const overlay = document.getElementById('overlay');
    const styles = contentGroup.querySelectorAll('.style');

    const numSlides = styles.length;

    window.addEventListener('scroll', () => {
      const rect = scrollContainer.getBoundingClientRect();
      const scrollProgress = Math.min(1, Math.max(0, -rect.top / (window.innerHeight * (numSlides - 1))));
      const translateX = -scrollProgress * 100 * (numSlides - 1);

      contentGroup.style.transform = `translateX(${translateX}%)`;
      overlay.style.transform = `translateX(${translateX}%)`;

      styles.forEach((el, i) => {
        const localProgress = Math.max(0, Math.min(1, scrollProgress * numSlides - i));
        el.style.setProperty('--clip-progress', localProgress);
      });
    });
  </script>
</body>
</html>
