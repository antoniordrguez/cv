<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Desplazamiento Horizontal con Gap General y por Bloques</title>
  <style>
    /* Reset y estilos básicos */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #fff;
    }
    /* Espaciadores para simular contenido adicional */
    .spacer {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
    }
    /* Sección con altura extendida para generar el espacio de scroll vertical */
    .scroll-section {
      position: relative;
      height: 400vh; /* Ajusta este valor según tus necesidades */
    }
    /* Contenedor sticky que se mantiene fijo durante el scroll */
    .sticky-container {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      /* Máscara para difuminar los laterales: solo el centro se ve nítido */
      -webkit-mask-image: linear-gradient(to right, transparent 15%, black 50%, transparent 85%);
      mask-image: linear-gradient(to right, transparent 15%, black 50%, transparent 85%);
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }
    /* Contenedor horizontal que se desplazará según el scroll vertical */
    .horizontal-container {
      display: flex;
      height: 100%;
      transition: transform 0.1s ease-out;
    }
    /* Cada párrafo se muestra como un bloque de ancho completo (100vw) */
    .horizontal-container p {
      min-width: 100vw;
      margin: 0;
      padding: 20px;
      font-size: 2em;
      text-align: center;
      background-color: #ddd;
      border-right: 1px solid #fff;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="spacer">
    <h1>Contenido Superior</h1>
  </div>

  <!-- Sección con desplazamiento horizontal controlado por scroll vertical -->
  <section class="scroll-section">
    <div class="sticky-container">
      <div class="horizontal-container" id="horizontal-container">
        <p>Párrafo 1: Primer texto.</p>
        <p>Párrafo 2: Segundo texto.</p>
        <p>Párrafo 3: Tercer texto.</p>
        <p>Párrafo 4: Cuarto texto.</p>
      </div>
    </div>
  </section>

  <div class="spacer">
    <h1>Contenido Inferior</h1>
  </div>

  <script>
    // Seleccionamos el contenedor horizontal y la sección de scroll
    const horizontalContainer = document.getElementById('horizontal-container');
    const scrollSection = document.querySelector('.scroll-section');
    const numBlocks = horizontalContainer.children.length; // número total de párrafos

    // Para bloques de 100vw cada uno, se espera que:
    // totalWidth = numBlocks * window.innerWidth
    // y el máximo desplazamiento horizontal es:
    const totalWidth = horizontalContainer.scrollWidth;
    const maxTranslate = totalWidth - window.innerWidth; // (numBlocks - 1) * window.innerWidth

    // --- GAP GENERAL en el scroll vertical ---
    // Antes de que inicie el desplazamiento horizontal y después de completarlo.
    const overallGapStart = 0.15; // 20% del scroll vertical para iniciar
    const overallGapEnd   = 0.85; // 80% para completar el desplazamiento

    // --- GAP POR BLOQUES ---
    // Cada transición entre un párrafo y el siguiente tendrá un "dead zone"
    // de modo que, dentro de cada segmento, durante cierto porcentaje el bloque se mantiene fijo.
    const localGapStart = 0.30; // porcentaje inicial de cada segmento sin movimiento
    const localGapEnd   = 0.70 // porcentaje final donde se completa la transición

    window.addEventListener('scroll', () => {
      const sectionRect = scrollSection.getBoundingClientRect();
      let progress = 0;
      // Se calcula el progreso cuando la sección ha pasado o tocado el tope del viewport.
      if (sectionRect.top <= 0) {
        progress = Math.min(Math.abs(sectionRect.top) / (scrollSection.offsetHeight - window.innerHeight), 1);
      }

      // Aplicamos el GAP GENERAL:
      let overallProgress = 0;
      if (progress < overallGapStart) {
        overallProgress = 0;
      } else if (progress > overallGapEnd) {
        overallProgress = 1;
      } else {
        overallProgress = (progress - overallGapStart) / (overallGapEnd - overallGapStart);
      }

      // Mapeamos overallProgress (de 0 a 1) a los bloque (de 0 a numBlocks - 1)
      const numTransitions = numBlocks - 1;
      const segmentLength = 1 / numTransitions;
      let segmentIndex = Math.floor(overallProgress / segmentLength);
      if (segmentIndex >= numTransitions) {
        segmentIndex = numTransitions - 1;
      }
      // Progreso dentro del segmento actual (de 0 a 1)
      let localProgress = (overallProgress - segmentIndex * segmentLength) / segmentLength;

      // Aplicamos el GAP POR BLOQUES:
      let interp = 0;
      if (localProgress < localGapStart) {
        interp = 0;
      } else if (localProgress > localGapEnd) {
        interp = 1;
      } else {
        interp = (localProgress - localGapStart) / (localGapEnd - localGapStart);
      }

      // El índice efectivo (continúa) para la posición horizontal es:
      const effectiveIndex = segmentIndex + interp;
      // Convertimos el índice en desplazamiento horizontal
      const translateX = effectiveIndex * window.innerWidth;
      horizontalContainer.style.transform = `translateX(-${translateX}px)`;
    });
  </script>
</body>
</html>
