<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Efecto Fade entre Párrafos en Scroll</title>
  <style>
    /* Estilos básicos */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    /* Contenido antes y después para notar el scroll */
    .spacer {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
    }
    /* Sección del scroll: la altura extendida crea el espacio para el efecto */
    .scroll-section {
      position: relative;
      height: 400vh; /* Ajusta este valor según el efecto deseado */
    }
    /* Contenedor sticky que se queda fijo en la ventana durante el scroll */
    .sticky-container {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
    }
    /* Contenedor relativo para posicionar cada bloque en el centro */
    .horizontal-container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    /* Cada párrafo se posiciona de forma absoluta en el centro */
    .horizontal-container p {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2em;
      margin: 0;
      padding: 20px;
      background: #ddd;
      width: 80%;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s ease-out;
    }
  </style>
</head>
<body>
  <div class="spacer">
    <h1>Contenido Superior</h1>
  </div>

  <!-- Sección con efecto de fade entre bloques -->
  <section class="scroll-section">
    <div class="sticky-container">
      <div class="horizontal-container" id="horizontal-container">
        <p>Párrafo 1: Primer texto.</p>
        <p>Párrafo 2: Segundo texto.</p>
        <p>Párrafo 3: Tercer texto.</p>
        <p>Párrafo 4: Cuarto texto.</p>
      </div>
    </div>
  </section>

  <div class="spacer">
    <h1>Contenido Inferior</h1>
  </div>

  <script>
    const horizontalContainer = document.getElementById('horizontal-container');
    const scrollSection = document.querySelector('.scroll-section');
    const paragraphs = horizontalContainer.querySelectorAll('p');
    const numBlocks = paragraphs.length;

    // Definimos los "gaps": el desplazamiento horizontal (o en este caso, el fade) no comienza hasta un 20% del scroll, y no se completa hasta un 80%.
    const gapStart = 0.20; // 20%
    const gapEnd = 0.80;   // 80%

    window.addEventListener('scroll', () => {
      const sectionRect = scrollSection.getBoundingClientRect();
      let progress = 0;

      // Calculamos el progreso solo cuando la sección ha llegado a la parte superior del viewport.
      if (sectionRect.top <= 0) {
        progress = Math.min(Math.abs(sectionRect.top) / (scrollSection.offsetHeight - window.innerHeight), 1);
      }

      // Aplicamos los gaps para que el efecto de fade no se active inmediatamente al entrar ni se complete al final.
      let effectiveProgress = 0;
      if (progress < gapStart) {
        effectiveProgress = 0;
      } else if (progress > gapEnd) {
        effectiveProgress = 1;
      } else {
        effectiveProgress = (progress - gapStart) / (gapEnd - gapStart);
      }

      // Convertimos el progreso efectivo en un índice continuo (de 0 a numBlocks - 1)
      const continuousIndex = effectiveProgress * (numBlocks - 1);

      // Para cada párrafo, calculamos la diferencia respecto al índice continuo y ajustamos su opacidad
      paragraphs.forEach((p, i) => {
        const diff = Math.abs(i - continuousIndex);
        // Usamos una transición lineal: el párrafo con diferencia 0 tendrá opacidad 1, mientras que si la diferencia es 1, tendrá opacidad 0.
        const opacity = Math.max(1 - diff, 0);
        p.style.opacity = opacity;
      });
    });
  </script>
</body>
</html>
