<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Horizontal con Overlay y Ajuste de Z-Index</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    .spacer {
      height: 100vh;
      background: #000;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .scroll-container {
      height: calc(100vh * 3);
      position: relative;
      background: black;
      z-index: 0;
    }

    /* Contenedor sticky que fija la zona horizontal y se sitúa por encima del fondo */
    .styles-wrapper {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    /* Título fijo que permanece en la parte superior de la sección */
    .fixed-title {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      color: white;
    }

    /* Contenedor de la galería */
    .styles-gallery {
      width: 100vw;
      height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative; /* Crea un stacking context */
      z-index: 2;
      overflow: hidden;
    }

    /* Contenedor de los slides con padding lateral para centrar el primer y último slide */
    .content-group {
      display: flex;
      padding: 0 10vw;
      width: max-content;
      transition: transform 0.1s ease-out;
      position: relative;
      z-index: 2; /* Debe estar sobre el overlay */
    }

    /* Cada slide */
    .style {
      flex: 0 0 auto;
      width: 80vw;
      height: 80vh;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      font-weight: bold;
      color: #333;
      clip-path: inset(0 calc((1 - var(--clip-progress, 1)) * 100%) 0 0);
      transition: clip-path 0.3s ease-out;
      box-sizing: border-box;
    }

    .style.default::before {
      content: "Bloque 1";
    }

    .style.color::before {
      content: "Bloque 2";
    }

    .style.bw::before {
      content: "Bloque 3";
    }

    /* Overlay para el efecto de marco animado, ubicado detrás del contenido */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: calc(100vw + 20vw); /* Viewport + padding lateral */
      height: 100%;
      display: flex;
      pointer-events: none;
      transition: transform 0.1s ease-out;
      z-index: 1;
    }

    .slide {
      flex: 0 0 100vw; /* Cada slide del overlay ocupa el ancho total del viewport */
      height: 100%;
      position: relative;
    }

    .slide .corner,
    .slide .rect {
      position: absolute;
      background: black;
    }

    .corner {
      width: 20px;
      height: 20px;
    }

    .rect {
      background: black;
    }

    .top.left { top: 0; left: 0; }
    .top.right { top: 0; right: 0; }
    .bottom.left { bottom: 0; left: 0; }
    .bottom.right { bottom: 0; right: 0; }

    .rect.top { top: 0; left: 20px; right: 20px; height: 4px; }
    .rect.bottom { bottom: 0; left: 20px; right: 20px; height: 4px; }
    .rect.left { top: 20px; bottom: 20px; left: 0; width: 4px; }
    .rect.right { top: 20px; bottom: 20px; right: 0; width: 4px; }
  </style>
</head>
<body>
  <div class="spacer">Scroll para ver la galería</div>

  <div class="scroll-container" id="scroll-container">
    <div class="styles-wrapper">
      <!-- Título fijo -->
      <div class="fixed-title">
        <h1>Mi Galería Fija</h1>
      </div>
      <div class="styles-gallery">
        <!-- Contenedor de slides -->
        <div class="content-group" id="content-group">
          <div class="style default"></div>
          <div class="style color"></div>
          <div class="style bw"></div>
        </div>
        <!-- Overlay para el marco animado -->
        <div class="overlay" id="overlay">
          <div class="slide">
            <div class="corner top left"></div>
            <div class="rect top"></div>
            <div class="corner top right"></div>
            <div class="rect right"></div>
            <div class="corner bottom right"></div>
            <div class="rect bottom"></div>
            <div class="corner bottom left"></div>
            <div class="rect left"></div>
          </div>
          <div class="slide">
            <div class="corner top left"></div>
            <div class="rect top"></div>
            <div class="corner top right"></div>
            <div class="rect right"></div>
            <div class="corner bottom right"></div>
            <div class="rect bottom"></div>
            <div class="corner bottom left"></div>
            <div class="rect left"></div>
          </div>
          <div class="slide">
            <div class="corner top left"></div>
            <div class="rect top"></div>
            <div class="corner top right"></div>
            <div class="rect right"></div>
            <div class="corner bottom right"></div>
            <div class="rect bottom"></div>
            <div class="corner bottom left"></div>
            <div class="rect left"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="spacer">Fin de la galería</div>

  <script>
    const scrollContainer = document.getElementById('scroll-container');
    const contentGroup = document.getElementById('content-group');
    const overlay = document.getElementById('overlay');
    const styles = contentGroup.querySelectorAll('.style');
    const numSlides = styles.length;
    const slideWidth = 80; // ancho de cada slide en vw

    window.addEventListener('scroll', () => {
      const rect = scrollContainer.getBoundingClientRect();
      // Calcula el progreso del scroll (valor entre 0 y 1)
      const scrollProgress = Math.min(1, Math.max(0, -rect.top / (window.innerHeight * (numSlides - 1))));
      // Calcula la traslación total en vw
      const translateX = -scrollProgress * ((numSlides - 1) * slideWidth);
      
      contentGroup.style.transform = `translateX(${translateX}vw)`;
      overlay.style.transform = `translateX(${translateX}vw)`;
      
      // Efecto clip para cada slide
      styles.forEach((el, i) => {
        const localProgress = Math.max(0, Math.min(1, scrollProgress * numSlides - i));
        el.style.setProperty('--clip-progress', localProgress);
      });
    });
  </script>
</body>
</html>
