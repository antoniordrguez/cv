<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Efecto de Transición con Fade y Máscara</title>
  <style>
    /* Estilos básicos */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #fff;
    }
    /* Espaciadores para ver contenido antes y después */
    .spacer {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
    }
    /* Sección con altura extendida para generar el espacio de scroll */
    .scroll-section {
      position: relative;
      height: 400vh; /* Ajusta este valor según tus necesidades */
    }
    /* Contenedor sticky que se mantiene fijo durante el scroll */
    .sticky-container {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      /* Máscara para difuminar los bordes izquierdo y derecho */
      -webkit-mask-image: linear-gradient(to right, transparent 10%, black 20%, black 80%, transparent 90%);
      mask-image: linear-gradient(to right, transparent 10%, black 20%, black 80%, transparent 90%);
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }
    /* Contenedor para posicionar los párrafos */
    .horizontal-container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    /* Cada párrafo se posiciona absolutamente en el centro */
    .horizontal-container p {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2em;
      padding: 20px;
      margin: 0;
      background: #ddd;
      width: 80%;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s ease-out;
    }
  </style>
</head>
<body>
  <div class="spacer">
    <h1>Contenido Superior</h1>
  </div>

  <!-- Sección del efecto de transición -->
  <section class="scroll-section">
    <div class="sticky-container">
      <div class="horizontal-container" id="horizontal-container">
        <p>Párrafo 1: Primer texto.</p>
        <p>Párrafo 2: Segundo texto.</p>
        <p>Párrafo 3: Tercer texto.</p>
        <p>Párrafo 4: Cuarto texto.</p>
      </div>
    </div>
  </section>

  <div class="spacer">
    <h1>Contenido Inferior</h1>
  </div>

  <script>
    // Selección de elementos
    const horizontalContainer = document.getElementById('horizontal-container');
    const scrollSection = document.querySelector('.scroll-section');
    const paragraphs = horizontalContainer.querySelectorAll('p');
    const numBlocks = paragraphs.length;

    // Definición de gaps para que el efecto no inicie ni finalice de inmediato
    const gapStart = 0.20; // 20% del scroll en la sección para iniciar la transición
    const gapEnd = 0.80;   // 80% para completar la transición

    window.addEventListener('scroll', () => {
      // Se obtiene la posición de la sección respecto al viewport
      const sectionRect = scrollSection.getBoundingClientRect();
      let progress = 0;
      // Solo se calcula el progreso cuando la parte superior de la sección está en (o sobre) el tope del viewport
      if (sectionRect.top <= 0) {
        progress = Math.min(Math.abs(sectionRect.top) / (scrollSection.offsetHeight - window.innerHeight), 1);
      }
      
      // Se aplica el gap al efecto: sin transición antes del 20% y sin cambios tras el 80%
      let effectiveProgress = 0;
      if (progress < gapStart) {
        effectiveProgress = 0;
      } else if (progress > gapEnd) {
        effectiveProgress = 1;
      } else {
        effectiveProgress = (progress - gapStart) / (gapEnd - gapStart);
      }
      
      // Se mapea el progreso efectivo a un índice continuo entre 0 y (numBlocks - 1)
      const continuousIndex = effectiveProgress * (numBlocks - 1);
      
      // Para cada párrafo, se calcula la diferencia con el índice central y se ajusta su opacidad
      paragraphs.forEach((p, i) => {
        const diff = Math.abs(i - continuousIndex);
        // El párrafo más centrado (diferencia 0) tendrá opacidad 1 y los demás se desvanecerán proporcionalmente
        const opacity = Math.max(1 - diff, 0);
        p.style.opacity = opacity;
      });
    });
  </script>
</body>
</html>
