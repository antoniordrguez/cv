<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Efecto Scroll Horizontal Fijo (Ajustado)</title>
  <style>
    /* Reset básico */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    /* Espaciadores para ver contenido antes y después */
    .spacer {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
    }
    /* Sección con altura extendida para permitir el scroll vertical */
    .scroll-section {
      position: relative;
      /* La altura debe ser proporcional al ancho total del contenido horizontal.
           En este ejemplo, con 4 párrafos de 100vw, usamos 400vh. */
      height: 400vh;
    }
    /* Contenedor sticky que se queda fijo durante el scroll dentro de la sección */
    .sticky-container {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
    }
    /* Contenedor horizontal que se desplaza internamente */
    .horizontal-container {
      display: flex;
      height: 100%;
      transition: transform 0.1s ease-out;
    }
    /* Cada párrafo ocupa el ancho completo de la ventana */
    .horizontal-container p {
      min-width: 100vw;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      font-size: 1.5em;
      text-align: center;
      background: #ddd;
      border-right: 1px solid #fff;
    }
  </style>
</head>
<body>
  <div class="spacer">
    <h1>Contenido Superior</h1>
  </div>

  <!-- Sección del efecto de scroll horizontal -->
  <section class="scroll-section">
    <div class="sticky-container">
      <div class="horizontal-container" id="horizontal-container">
        <p>Párrafo 1: Primer texto.</p>
        <p>Párrafo 2: Segundo texto.</p>
        <p>Párrafo 3: Tercer texto.</p>
        <p>Párrafo 4: Cuarto texto.</p>
      </div>
    </div>
  </section>

  <div class="spacer">
    <h1>Contenido Inferior</h1>
  </div>

  <script>
    const horizontalContainer = document.getElementById('horizontal-container');
    const scrollSection = document.querySelector('.scroll-section');

    // Calculamos el máximo desplazamiento horizontal (la diferencia entre el ancho total del contenido y el viewport)
    const totalWidth = horizontalContainer.scrollWidth;
    const maxTranslate = totalWidth - window.innerWidth;

    window.addEventListener('scroll', () => {
      const sectionRect = scrollSection.getBoundingClientRect();
      let progress = 0;
      
      // Solo iniciamos el desplazamiento cuando la parte superior de la sección ya ha llegado a (o sobre) la parte superior del viewport.
      if (sectionRect.top <= 0) {
        progress = Math.min((Math.abs(sectionRect.top)) / (scrollSection.offsetHeight - window.innerHeight), 1);
      }
      
      horizontalContainer.style.transform = `translateX(-${progress * maxTranslate}px)`;
    });
  </script>
</body>
</html>
