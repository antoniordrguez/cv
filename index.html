<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Desplazamiento Horizontal con Difuminado en Laterales</title>
  <style>
    /* Reset y estilos básicos */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #fff;
    }
    /* Espaciadores para simular contenido antes y después */
    .spacer {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
    }
    /* Sección de scroll: se extiende la altura para permitir el efecto vertical */
    .scroll-section {
      position: relative;
      height: 400vh; /* Ajusta este valor según la cantidad de bloques */
    }
    /* Contenedor sticky que permanecerá fijo en la ventana mientras se desplaza la sección */
    .sticky-container {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      /* Máscara para difuminar los laterales: solo el centro se ve completamente */
      -webkit-mask-image: linear-gradient(to right, transparent 15%, black 50%, transparent 85%);
      mask-image: linear-gradient(to right, transparent 15%, black 50%, transparent 85%);
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }
    /* Contenedor horizontal que se desplazará en función del scroll vertical */
    .horizontal-container {
      display: flex;
      height: 100%;
      transition: transform 0.1s ease-out;
    }
    /* Cada párrafo se muestra como un bloque de ancho completo (100vw) */
    .horizontal-container p {
      min-width: 100vw;
      margin: 0;
      padding: 20px;
      font-size: 2em;
      text-align: center;
      background-color: #ddd;
      border-right: 1px solid #fff;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="spacer">
    <h1>Contenido Superior</h1>
  </div>

  <!-- Sección de desplazamiento horizontal controlado por scroll vertical -->
  <section class="scroll-section">
    <div class="sticky-container">
      <div class="horizontal-container" id="horizontal-container">
        <p>Párrafo 1: Primer texto.</p>
        <p>Párrafo 2: Segundo texto.</p>
        <p>Párrafo 3: Tercer texto.</p>
        <p>Párrafo 4: Cuarto texto.</p>
      </div>
    </div>
  </section>

  <div class="spacer">
    <h1>Contenido Inferior</h1>
  </div>

  <script>
    // Seleccionamos el contenedor horizontal y la sección de scroll
    const horizontalContainer = document.getElementById('horizontal-container');
    const scrollSection = document.querySelector('.scroll-section');

    // Calculamos el máximo desplazamiento horizontal:
    // Es la diferencia entre el ancho total del contenido y el ancho del viewport.
    const totalWidth = horizontalContainer.scrollWidth;
    const maxTranslate = totalWidth - window.innerWidth;

    window.addEventListener('scroll', () => {
      const sectionRect = scrollSection.getBoundingClientRect();
      let progress = 0;
      // Solo se calcula el progreso cuando la sección ya está en el viewport (o sobrepasó el tope)
      if (sectionRect.top <= 0) {
        progress = Math.min(Math.abs(sectionRect.top) / (scrollSection.offsetHeight - window.innerHeight), 1);
      }
      // Se actualiza el transform para desplazar el contenedor horizontalmente
      horizontalContainer.style.transform = `translateX(-${progress * maxTranslate}px)`;
    });
  </script>
</body>
</html>
