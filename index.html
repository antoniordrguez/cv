<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Título Fijo + Bloques Horizontales con Fade</title>
  <style>
    /* Reset y estilos básicos */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    .spacer {
      height: 100vh; /* Para simular contenido antes y después */
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
    }
    /* Sección principal con altura extendida para generar scroll vertical */
    .scroll-section {
      position: relative;
      height: 400vh; /* Ajusta este valor según cuántos bloques tengas */
    }
    /* Contenedor sticky: se queda fijo en el viewport a medida que hacemos scroll */
    .sticky-container {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
    }
    /* Título de la sección, fijo en la parte superior sin verse afectado por la máscara */
    .section-title {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2rem;
      margin: 0;
      padding: 10px 20px;
      z-index: 10; /* Para que quede por encima de los bloques */
      background: white; /* Opcional, por si quieres un fondo */
    }
    /* Contenedor que aplica la máscara (difuminado) solo en los laterales de los bloques */
    .blocks-mask {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;         /* Ajusta el tamaño deseado para los bloques */
      height: 60vh;       /* Ajusta la altura deseada para los bloques */
      -webkit-mask-image: linear-gradient(to right, transparent 15%, black 50%, transparent 85%);
      mask-image: linear-gradient(to right, transparent 15%, black 50%, transparent 85%);
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      overflow: hidden;   /* Evita que aparezca scroll interno */
    }
    /* Contenedor horizontal que se desplaza según el scroll vertical */
    .horizontal-container {
      display: flex;
      height: 100%;
      transition: transform 0.1s ease-out; /* Suaviza el movimiento */
    }
    /* Cada bloque ocupa la totalidad del ancho de .blocks-mask (en este caso 80% de la pantalla) */
    .block {
      min-width: 80%;
      height: 100%;
      flex-shrink: 0;
      background: #ddd;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      border-right: 1px solid #fff;
    }
  </style>
</head>
<body>

  <div class="spacer">
    <h1>Contenido Superior</h1>
  </div>

  <!-- Sección con el efecto de bloque horizontal difuminado -->
  <section class="scroll-section">
    <div class="sticky-container">

      <!-- Título fijo que NO se desplaza horizontalmente -->
      <h1 class="section-title">TÍTULO DE LA SECCIÓN</h1>

      <!-- Contenedor que aplica la máscara (fade) solo a los bloques -->
      <div class="blocks-mask">
        <div class="horizontal-container" id="horizontal-container">
          <div class="block">Bloque de Texto 1</div>
          <div class="block">Bloque de Texto 2</div>
          <div class="block">Bloque de Texto 3</div>
          <div class="block">Bloque de Texto 4</div>
        </div>
      </div>

    </div>
  </section>

  <div class="spacer">
    <h1>Contenido Inferior</h1>
  </div>

  <script>
    // --- CONFIGURACIÓN DE SCROLL Y GAPS ---
    const scrollSection = document.querySelector('.scroll-section');
    const horizontalContainer = document.getElementById('horizontal-container');

    // Número de bloques
    const numBlocks = horizontalContainer.children.length;

    // Ancho total: cada bloque mide "80%" del viewport, pero en píxeles
    const blocksMask = document.querySelector('.blocks-mask');
    const blockWidth = blocksMask.offsetWidth; // ancho real en píxeles
    const totalWidth = blockWidth * numBlocks;
    const maxTranslate = totalWidth - blockWidth;

    // GAP general antes de iniciar la transición y al finalizar
    const overallGapStart = 0.10; // 20%
    const overallGapEnd   = 0.90; // 80%

    // GAP local entre bloques
    const localGapStart = 0.30; // 30% del segmento
    const localGapEnd   = 0.70; // 70% del segmento

    window.addEventListener('scroll', () => {
      const sectionRect = scrollSection.getBoundingClientRect();
      let progress = 0;

      // Progreso de 0 a 1 según la posición de la sección (cuando top <= 0)
      if (sectionRect.top <= 0) {
        progress = Math.min(
          Math.abs(sectionRect.top) / (scrollSection.offsetHeight - window.innerHeight),
          1
        );
      }

      // 1) GAP GENERAL
      let overallProgress = 0;
      if (progress < overallGapStart) {
        overallProgress = 0;
      } else if (progress > overallGapEnd) {
        overallProgress = 1;
      } else {
        overallProgress = (progress - overallGapStart) / (overallGapEnd - overallGapStart);
      }

      // 2) DIVIDIR EN SEGMENTOS PARA CADA BLOQUE
      const numTransitions = numBlocks - 1;
      const segmentLength = 1 / numTransitions;
      let segmentIndex = Math.floor(overallProgress / segmentLength);

      // Ajuste si overallProgress llega a 1
      if (segmentIndex >= numTransitions) {
        segmentIndex = numTransitions - 1;
      }

      // Progreso local dentro del segmento
      const localProgress = (overallProgress - segmentIndex * segmentLength) / segmentLength;

      // 3) GAP POR BLOQUE
      let interp = 0;
      if (localProgress < localGapStart) {
        interp = 0;
      } else if (localProgress > localGapEnd) {
        interp = 1;
      } else {
        interp = (localProgress - localGapStart) / (localGapEnd - localGapStart);
      }

      // Índice continuo del bloque actual
      const effectiveIndex = segmentIndex + interp;

      // Se traduce el índice al desplazamiento horizontal en píxeles
      const translateX = effectiveIndex * blockWidth;
      horizontalContainer.style.transform = `translateX(-${translateX}px)`;
    });
  </script>
</body>
</html>
