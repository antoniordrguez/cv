<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Horizontal con Bordes y Centrado Exacto</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }
    /* Espaciadores para separar la sección */
    .spacer {
      height: 100vh;
      background: #000;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* Contenedor principal de la sección */
    .scroll-container {
      height: calc(100vh * 3);
      position: relative;
      background: black;
      z-index: 0;
    }
    /* Contenedor sticky que fija la zona horizontal */
    .styles-wrapper {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    /* Título fijo en la parte superior */
    .fixed-title {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      color: white;
    }
    /* Contenedor de la galería */
    .styles-gallery {
      width: 100vw;
      height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 2;
      overflow: hidden;
    }
    /* Contenedor que engloba los slides  
       Se utiliza padding lateral de 10vw para centrar el primer y último slide */
    .content-group {
      display: flex;
      padding: 0 10vw;
      width: max-content;
      transition: transform 0.1s ease-out;
      position: relative;
      z-index: 2;
    }
    /* Cada slide con 80vw de ancho, 80vh de alto y borde para crear el marco */
    .style {
      flex: 0 0 auto;
      width: 80vw;
      height: 80vh;
      background-color: #f0f0f0;
      border: 20px solid black; /* Borde del mismo color que el fondo */
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      font-weight: bold;
      color: #333;
    }
    /* Etiquetas para identificar cada slide */
    .style.default::before {
      content: "Contenido 1";
    }
    .style.color::before {
      content: "Contenido 2";
    }
    .style.bw::before {
      content: "Contenido 3";
    }
  </style>
</head>
<body>
  <div class="spacer">Scroll para ver la galería</div>
  
  <div class="scroll-container" id="scroll-container">
    <div class="styles-wrapper">
      <!-- Título fijo -->
      <div class="fixed-title">
        <h1>Mi Galería Fija</h1>
      </div>
      <div class="styles-gallery">
        <div class="content-group" id="content-group">
          <div class="style default"></div>
          <div class="style color"></div>
          <div class="style bw"></div>
        </div>
      </div>
    </div>
  </div>
  
  <div class="spacer">Fin de la galería</div>
  
  <script>
    const scrollContainer = document.getElementById('scroll-container');
    const contentGroup = document.getElementById('content-group');
    const numSlides = contentGroup.querySelectorAll('.style').length;
    // La cantidad de desplazamiento horizontal necesario es 160vw
    const maxTranslateVW = 160; 

    // Calculamos la distancia vertical de scroll del contenedor:
    //   totalVerticalScroll = scrollContainer.offsetHeight - window.innerHeight
    const scrollDistance = scrollContainer.offsetHeight - window.innerHeight;
    // El punto de inicio es cuando la sección empieza a estar en pantalla
    const containerStart = scrollContainer.offsetTop;

    window.addEventListener('scroll', () => {
      // Progreso del scroll (valor entre 0 y 1)
      const scrollY = window.scrollY;
      let progress = (scrollY - containerStart) / scrollDistance;
      if (progress < 0) progress = 0;
      if (progress > 1) progress = 1;

      // Calculamos la traslación horizontal en vw
      const translateX = - progress * maxTranslateVW;
      contentGroup.style.transform = `translateX(${translateX}vw)`;
    });
  </script>
</body>
</html>
