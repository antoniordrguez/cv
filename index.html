<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Efecto de scroll horizontal con párrafos</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      /* Se extiende el scroll para poder apreciar el efecto */
      height: 200vh;
    }
    /* Sección que contiene el efecto */
    .scroll-section {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }
    /* Contenedor horizontal que se mantendrá fijo (sticky) durante el scroll */
    .horizontal-container {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      /* Para que el contenido se muestre en una línea horizontal */
      white-space: nowrap;
      will-change: transform;
      transition: transform 0.1s ease-out;
    }
    /* Estilos para cada párrafo */
    .horizontal-container p {
      font-size: 1.8em;
      margin: 0 2em;
      display: inline-block;
    }
  </style>
</head>
<body>
  <!-- Contenido antes de la sección para notar el scroll -->
  <div style="height: 50vh; display: flex; justify-content: center; align-items: center;">
    <h1>Contenido Inicial</h1>
  </div>

  <!-- Sección del efecto -->
  <section class="scroll-section">
    <div class="horizontal-container" id="horizontal-container">
      <p>Párrafo 1: Este es el primer párrafo que se desplaza horizontalmente.</p>
      <p>Párrafo 2: Otro párrafo para demostrar el efecto.</p>
      <p>Párrafo 3: Continúa el desplazamiento con contenido interesante.</p>
      <p>Párrafo 4: Concluye el efecto con este texto final.</p>
    </div>
  </section>

  <!-- Contenido posterior para completar el scroll -->
  <div style="height: 150vh; display: flex; justify-content: center; align-items: center;">
    <h1>Contenido Final</h1>
  </div>

  <script>
    // Seleccionamos el contenedor de los párrafos y la sección del efecto.
    const horizontalContainer = document.getElementById('horizontal-container');
    const scrollSection = document.querySelector('.scroll-section');
    
    // Se obtiene la posición superior y altura de la sección.
    const sectionTop = scrollSection.offsetTop;
    const sectionHeight = scrollSection.offsetHeight;
    
    // Escuchamos el evento de scroll para actualizar el desplazamiento horizontal.
    window.addEventListener('scroll', () => {
      const scrollY = window.pageYOffset;
      
      // Solo actuamos cuando estamos en la sección deseada
      if (scrollY >= sectionTop && scrollY <= sectionTop + sectionHeight) {
        // Calculamos el progreso (valor entre 0 y 1)
        const progress = (scrollY - sectionTop) / sectionHeight;
        // Definimos la traslación horizontal deseada, por ejemplo de 0 a -500 píxeles.
        const translateX = -500 * progress;
        // Actualizamos el estilo transform del contenedor.
        horizontalContainer.style.transform = `translateX(${translateX}px)`;
      }
    });
  </script>
</body>
</html>
