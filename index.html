<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Horizontal con Overlay</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 200vh; /* para simular scroll */
      font-family: sans-serif;
    }

    .spacer {
      height: 100vh;
      background: #000;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .styles-gallery {
      position: relative;
      height: 100vh;
      overflow: hidden;
      background: black;
    }

    .styles-list {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content-group {
      display: flex;
      transition: transform 0.1s ease-out;
    }

    .style {
      min-width: 100vw;
      height: 100vh;
      background-size: cover;
      background-position: center;
      clip-path: inset(0 calc((1 - var(--clip-progress, 1)) * 100%) 0 0);
      transition: clip-path 0.3s ease-out;
    }

    .style.default {
      background-image: url('https://source.unsplash.com/random/1600x900?sig=1');
    }

    .style.color {
      background-image: url('https://source.unsplash.com/random/1600x900?sig=2');
    }

    .style.bw {
      background-image: url('https://source.unsplash.com/random/1600x900?sig=3');
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 300vw;
      height: 100%;
      display: flex;
      pointer-events: none;
      transition: transform 0.1s ease-out;
    }

    .slide {
      width: 100vw;
      height: 100%;
      position: relative;
    }

    .slide .corner,
    .slide .rect {
      position: absolute;
      background: white;
    }

    .corner {
      width: 20px;
      height: 20px;
    }

    .rect {
      background: white;
    }

    .top.left { top: 0; left: 0; }
    .top.right { top: 0; right: 0; }
    .bottom.left { bottom: 0; left: 0; }
    .bottom.right { bottom: 0; right: 0; }

    .rect.top { top: 0; left: 20px; right: 20px; height: 4px; }
    .rect.bottom { bottom: 0; left: 20px; right: 20px; height: 4px; }
    .rect.left { top: 20px; bottom: 20px; left: 0; width: 4px; }
    .rect.right { top: 20px; bottom: 20px; right: 0; width: 4px; }
  </style>
</head>
<body>

  <div class="spacer">Scroll para ver la galería</div>

  <section class="styles-gallery">
    <div class="styles-list">
      <div class="content-group">
        <div class="style default"></div>
        <div class="style color"></div>
        <div class="style bw"></div>
        <div class="overlay">
          <div class="slide">
            <div class="corner top left"></div>
            <div class="rect top"></div>
            <div class="corner top right"></div>
            <div class="rect right"></div>
            <div class="corner bottom right"></div>
            <div class="rect bottom"></div>
            <div class="corner bottom left"></div>
            <div class="rect left"></div>
          </div>
          <div class="slide">
            <div class="corner top left"></div>
            <div class="rect top"></div>
            <div class="corner top right"></div>
            <div class="rect right"></div>
            <div class="corner bottom right"></div>
            <div class="rect bottom"></div>
            <div class="corner bottom left"></div>
            <div class="rect left"></div>
          </div>
          <div class="slide">
            <div class="corner top left"></div>
            <div class="rect top"></div>
            <div class="corner top right"></div>
            <div class="rect right"></div>
            <div class="corner bottom right"></div>
            <div class="rect bottom"></div>
            <div class="corner bottom left"></div>
            <div class="rect left"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="spacer">Fin de la galería</div>

  <script>
    const section = document.querySelector('.styles-gallery');
    const content = section.querySelector('.content-group');
    const styles = content.querySelectorAll('.style');
    const overlay = content.querySelector('.overlay');

    window.addEventListener('scroll', () => {
      const sectionTop = section.offsetTop;
      const sectionHeight = section.offsetHeight;
      const scrollY = window.scrollY;

      if (scrollY >= sectionTop && scrollY <= sectionTop + sectionHeight) {
        const progress = (scrollY - sectionTop) / sectionHeight;
        const translateX = -progress * window.innerWidth * (styles.length - 1);

        content.style.transform = `translateX(${translateX}px)`;
        overlay.style.transform = `translateX(${translateX}px)`;

        styles.forEach((el, i) => {
          const localProgress = Math.max(0, Math.min(1, progress * styles.length - i));
          el.style.setProperty('--clip-progress', localProgress);
        });
      }
    });
  </script>
</body>
</html>
