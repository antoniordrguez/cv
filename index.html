<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Efecto Scroll Horizontal Fijo</title>
  <style>
    /* Reset básico */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    /* Espaciadores para ver contenido antes y después */
    .spacer {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
    }
    /* Sección con altura extendida para permitir el scroll vertical */
    .scroll-section {
      position: relative;
      /* La altura debe cubrir el ancho total del contenido horizontal.
           En este ejemplo, 4 párrafos ocupando 100vw cada uno = 400vw, 
           así que usamos 400vh, pero lo puedes ajustar según lo necesites. */
      height: 400vh;
    }
    /* Contenedor fijo dentro de la sección para contener el contenido horizontal */
    .sticky-container {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
    }
    /* Contenedor horizontal que se desplazará con transform */
    .horizontal-container {
      display: flex;
      height: 100%;
      transition: transform 0.1s ease-out;
    }
    /* Cada párrafo ocupa el ancho completo de la ventana */
    .horizontal-container p {
      min-width: 100vw;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      font-size: 1.5em;
      text-align: center;
      background: #ddd;
      border-right: 1px solid #fff;
    }
  </style>
</head>
<body>
  <div class="spacer">
    <h1>Contenido Superior</h1>
  </div>

  <!-- Sección del efecto de scroll horizontal -->
  <section class="scroll-section">
    <div class="sticky-container">
      <div class="horizontal-container" id="horizontal-container">
        <p>Párrafo 1: Primer texto.</p>
        <p>Párrafo 2: Segundo texto.</p>
        <p>Párrafo 3: Tercer texto.</p>
        <p>Párrafo 4: Cuarto texto.</p>
      </div>
    </div>
  </section>

  <div class="spacer">
    <h1>Contenido Inferior</h1>
  </div>

  <script>
    const horizontalContainer = document.getElementById('horizontal-container');
    const scrollSection = document.querySelector('.scroll-section');

    window.addEventListener('scroll', () => {
      // Obtenemos la distancia desde el top de la ventana hasta la sección
      const sectionRect = scrollSection.getBoundingClientRect();
      // Para calcular el progreso, usamos la altura de la ventana.
      // Cuando la parte superior de la sección toca la parte superior de la ventana,
      // sectionRect.top es 0; al final, será - (sección alta - window.innerHeight).
      const progress = Math.min(Math.max((window.innerHeight - sectionRect.top) / (scrollSection.offsetHeight - window.innerHeight), 0), 1);
      
      // Calculamos el máximo desplazamiento horizontal:
      // totalWidth es el ancho total del contenido horizontal.
      const totalWidth = horizontalContainer.scrollWidth;
      const maxTranslate = totalWidth - window.innerWidth;

      // Aplicamos la transformación horizontal basada en el progreso.
      horizontalContainer.style.transform = `translateX(-${progress * maxTranslate}px)`;
    });
  </script>
</body>
</html>
