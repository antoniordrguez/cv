<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bloque Centrado con Fade Lateral y Gaps en Scroll</title>
  <style>
    /* RESET BÁSICO Y CONFIGURACIÓN GENERAL */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #fff;
    }
    .spacer {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
    }

    /* SECCIÓN DE SCROLL */
    .scroll-section {
      position: relative;
      height: 400vh; /* Espacio vertical para trabajar el efecto */
    }
    /* Contenedor sticky que se queda fijo en el viewport */
    .sticky-container {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: visible;
    }
    /* Título fijo (no se mueve horizontalmente) */
    .section-title {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2rem;
      margin: 0;
      padding: 10px 20px;
      z-index: 10;
      background: white;
    }

    /* Wrapper para los bloques: delimita la “ventana” central */
    .blocks-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60vw;     /* El ancho de la "ventana" donde el bloque aparece nítido */
      height: 60vh;    /* Altura fija para el bloque */
      overflow: hidden; /* Oculta lo que se sale del área */
    }

    /* Contenedor horizontal que se moverá con scroll vertical */
    .horizontal-container {
      display: flex;
      height: 100%;
      transition: transform 0.1s ease-out;
    }
    /* Cada bloque ocupa el 100% del ancho del wrapper */
    .block {
      flex-shrink: 0;
      width: 100%;
      height: 100%;
      background: #ddd;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      border-right: 1px solid #fff;
    }

    /* Overlays de fade (difuminado) en los laterales del wrapper */
    .fade-overlay {
      position: absolute;
      top: 0;
      width: 15%; /* Ajusta este porcentaje según el efecto deseado */
      height: 100%;
      pointer-events: none; /* No interfiere con el scroll */
      z-index: 5;
    }
    .fade-overlay.left {
      left: 0;
      background: linear-gradient(to right, rgba(255,255,255,1), rgba(255,255,255,0));
    }
    .fade-overlay.right {
      right: 0;
      background: linear-gradient(to left, rgba(255,255,255,1), rgba(255,255,255,0));
    }
  </style>
</head>
<body>

  <div class="spacer">
    <h1>Contenido Superior</h1>
  </div>

  <!-- Sección con el título fijo y bloques móviles -->
  <section class="scroll-section">
    <div class="sticky-container">

      <!-- Título fijo -->
      <h1 class="section-title">TÍTULO DE LA SECCIÓN</h1>

      <!-- Wrapper central que define la "ventana" del bloque activo -->
      <div class="blocks-wrapper">
        <!-- Contenedor que se moverá horizontalmente -->
        <div class="horizontal-container" id="horizontal-container">
          <div class="block">Bloque 1: Texto de ejemplo</div>
          <div class="block">Bloque 2: Texto de ejemplo</div>
          <div class="block">Bloque 3: Texto de ejemplo</div>
          <div class="block">Bloque 4: Texto de ejemplo</div>
        </div>
        <!-- Overlays para crear efecto de difuminado en los laterales -->
        <div class="fade-overlay left"></div>
        <div class="fade-overlay right"></div>
      </div>

    </div>
  </section>

  <div class="spacer">
    <h1>Contenido Inferior</h1>
  </div>

  <script>
    /* CONFIGURACIÓN Y CÁLCULO DE SCROLL */
    const scrollSection = document.querySelector('.scroll-section');
    const horizontalContainer = document.getElementById('horizontal-container');
    const numBlocks = horizontalContainer.children.length;

    // Se medirá el ancho del wrapper (la "ventana" centrada) para calcular el desplazamiento
    const blocksWrapper = document.querySelector('.blocks-wrapper');
    
    // GAP GENERAL en el scroll vertical (para que no inicie ni finalice inmediatamente)
    const overallGapStart = 0.20; // 20%
    const overallGapEnd   = 0.80; // 80%

    // GAP LOCAL: cada transición entre bloques tendrá una "zona muerta"
    const localGapStart = 0.3; // 30% del segmento
    const localGapEnd   = 0.7; // 70% del segmento

    window.addEventListener('scroll', () => {
      const sectionRect = scrollSection.getBoundingClientRect();
      let progress = 0;
      if (sectionRect.top <= 0) {
        progress = Math.min(Math.abs(sectionRect.top) / (scrollSection.offsetHeight - window.innerHeight), 1);
      }
      // 1) GAP GENERAL: controla cuándo inicia y termina el movimiento horizontal global
      let overallProgress = 0;
      if (progress < overallGapStart) {
        overallProgress = 0;
      } else if (progress > overallGapEnd) {
        overallProgress = 1;
      } else {
        overallProgress = (progress - overallGapStart) / (overallGapEnd - overallGapStart);
      }
      // 2) Dividir en segmentos correspondientes a cada transición entre bloques
      const numTransitions = numBlocks - 1;
      const segmentLength = 1 / numTransitions;
      let segmentIndex = Math.floor(overallProgress / segmentLength);
      if (segmentIndex >= numTransitions) segmentIndex = numTransitions - 1;
      let localProgress = (overallProgress - segmentIndex * segmentLength) / segmentLength;
      // 3) GAP LOCAL: dentro de cada segmento se define una zona en la que el bloque se mantiene fijo
      let interp = 0;
      if (localProgress < localGapStart) {
        interp = 0;
      } else if (localProgress > localGapEnd) {
        interp = 1;
      } else {
        interp = (localProgress - localGapStart) / (localGapEnd - localGapStart);
      }
      const effectiveIndex = segmentIndex + interp;
      // 4) Calcular el desplazamiento horizontal: cada bloque ocupa el ancho del wrapper
      const blockWidth = blocksWrapper.offsetWidth;
      const translateX = effectiveIndex * blockWidth;
      horizontalContainer.style.transform = `translateX(-${translateX}px)`;
    });
  </script>
</body>
</html>
