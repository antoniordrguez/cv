<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bloque Centrado con Overlays de Borde, Fade y Gaps</title>
  <style>
    /* RESET BÁSICO Y CONFIGURACIÓN GENERAL */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #fff;
    }
    .spacer {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
    }
    /* SECCIÓN DE SCROLL */
    .scroll-section {
      position: relative;
      height: 400vh; /* Espacio vertical para trabajar el efecto */
    }
    /* Contenedor sticky que se queda fijo en el viewport */
    .sticky-container {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: visible;
    }
    /* Título fijo (no se desplaza horizontalmente) */
    .section-title {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2rem;
      margin: 0;
      padding: 10px 20px;
      z-index: 50;
      background: white;
    }
    /* Wrapper central (ventana) que define el área donde se muestra el bloque activo */
    .blocks-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60vw;  /* Ancho del área central */
      height: 60vh; /* Alto del área central */
      overflow: hidden;
      z-index: 10; /* Debe estar por debajo de los elementos fijos de borde */
    }
    /* Contenedor horizontal que se desplazará con scroll vertical */
    .horizontal-container {
      display: flex;
      height: 100%;
      transition: transform 0.1s ease-out;
    }
    /* Cada bloque ocupa el 100% del ancho del wrapper */
    .block {
      flex-shrink: 0;
      width: 100%;
      height: 100%;
      background: #ddd;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      border-right: 1px solid #fff;
    }
    /* Overlays de fade (difuminado) en los laterales del wrapper.
       Estos overlays se aplican dentro del wrapper, de modo que sólo el área
       central se vea nítida y las partes exteriores se desvanecen */
    .fade-overlay {
      position: absolute;
      top: 0;
      width: 15%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    .fade-overlay.left {
      left: 0;
      background: linear-gradient(to right, rgba(255,255,255,1), rgba(255,255,255,0));
    }
    .fade-overlay.right {
      right: 0;
      background: linear-gradient(to left, rgba(255,255,255,1), rgba(255,255,255,0));
    }
    /* Overlays para simular bordes fijos.
       Están posicionados en la parte externa del wrapper, sobre el sticky-container. */
    .fixed-border-overlay {
      position: absolute;
      top: calc(50% - 30vh); /* Centrado verticalmente respecto al wrapper de 60vh de alto */
      width: 5px;          /* Grosor del borde */
      height: 60vh;        /* Igual al alto del wrapper */
      background: #fff;     /* Color del borde (puedes ajustar) */
      z-index: 100;
      pointer-events: none;
    }
    .fixed-border-overlay.left {
      left: calc(50% - 30vw); /* 60vw es el ancho del wrapper, mitad es 30vw; este es el borde izquierdo */
    }
    .fixed-border-overlay.right {
      right: calc(50% - 30vw); /* Borde derecho */
    }
  </style>
</head>
<body>
  <div class="spacer">
    <h1>Contenido Superior</h1>
  </div>

  <!-- Sección con título fijo, bloques móviles, fade lateral y borde fijo -->
  <section class="scroll-section">
    <div class="sticky-container">
      <!-- Título fijo -->
      <h1 class="section-title">TÍTULO DE LA SECCIÓN</h1>

      <!-- Wrapper central que delimita la ventana de visualización del bloque activo -->
      <div class="blocks-wrapper">
        <!-- Contenedor horizontal que se desplazará -->
        <div class="horizontal-container" id="horizontal-container">
          <div class="block">Bloque 1: Texto de ejemplo</div>
          <div class="block">Bloque 2: Texto de ejemplo</div>
          <div class="block">Bloque 3: Texto de ejemplo</div>
          <div class="block">Bloque 4: Texto de ejemplo</div>
        </div>
        <!-- Overlays de difuminado en los laterales dentro del wrapper -->
        <div class="fade-overlay left"></div>
        <div class="fade-overlay right"></div>
      </div>

      <!-- Overlays para simular bordes fijos, posicionados sobre la ventana central -->
      <div class="fixed-border-overlay left"></div>
      <div class="fixed-border-overlay right"></div>
    </div>
  </section>

  <div class="spacer">
    <h1>Contenido Inferior</h1>
  </div>

  <script>
    /* CONFIGURACIÓN DEL SCROLL Y LOS GAPS */
    const scrollSection = document.querySelector('.scroll-section');
    const horizontalContainer = document.getElementById('horizontal-container');
    const numBlocks = horizontalContainer.children.length;
    const blocksWrapper = document.querySelector('.blocks-wrapper');

    // GAP GENERAL en el scroll vertical: evita que el movimiento horizontal inicie o finalice inmediatamente.
    const overallGapStart = 0.05; // 20%
    const overallGapEnd   = 0.95; // 80%

    // GAP LOCAL: en cada segmento (entre bloques) se define una zona sin movimiento.
    const localGapStart = 0.3; // 30% del segmento
    const localGapEnd   = 0.7; // 70% del segmento

    window.addEventListener('scroll', () => {
      const sectionRect = scrollSection.getBoundingClientRect();
      let progress = 0;
      if (sectionRect.top <= 0) {
        progress = Math.min(Math.abs(sectionRect.top) / (scrollSection.offsetHeight - window.innerHeight), 1);
      }

      // 1) GAP GENERAL: determina cuándo inicia y termina el movimiento horizontal global
      let overallProgress = 0;
      if (progress < overallGapStart) {
        overallProgress = 0;
      } else if (progress > overallGapEnd) {
        overallProgress = 1;
      } else {
        overallProgress = (progress - overallGapStart) / (overallGapEnd - overallGapStart);
      }

      // 2) Dividir overallProgress en segmentos para cada transición entre bloques
      const numTransitions = numBlocks - 1;
      const segmentLength = 1 / numTransitions;
      let segmentIndex = Math.floor(overallProgress / segmentLength);
      if (segmentIndex >= numTransitions) segmentIndex = numTransitions - 1;
      let localProgress = (overallProgress - segmentIndex * segmentLength) / segmentLength;

      // 3) GAP LOCAL: dentro de cada segmento se define una zona sin movimiento
      let interp = 0;
      if (localProgress < localGapStart) {
        interp = 0;
      } else if (localProgress > localGapEnd) {
        interp = 1;
      } else {
        interp = (localProgress - localGapStart) / (localGapEnd - localGapStart);
      }
      const effectiveIndex = segmentIndex + interp;

      // 4) Calcular el desplazamiento horizontal en función del ancho del wrapper
      const blockWidth = blocksWrapper.offsetWidth;
      const translateX = effectiveIndex * blockWidth;
      horizontalContainer.style.transform = `translateX(-${translateX}px)`;
    });
  </script>
</body>
</html>
